# GreenBlock game rooms — runs on Cloudflare's free Workers plan (no card needed).
# Each 4-letter game code gets its own small "room" (a Durable Object) that passes
# messages between the host's phone and the other phones over WebSockets.
name = "greenblock-rooms"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan only allows SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
